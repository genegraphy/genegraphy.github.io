 <div class="sec-head"><span class="sec-num">03</span><h2 data-ko="연구<span class='h2sub'>3D/XR 생성 · 바이오 AI · XAI · 미디어 포렌식 &amp; 허위정보 탐지</span>" data-en="Research<span class='h2sub'>Generative 3D/XR · Bio AI · XAI · Media Forensics &amp; Disinformation</span>"></h2></div>
 <p class="lead" style="margin-bottom:28px;" data-ko="비전·그래픽스 기반의 <b>3D 생성 모델</b>을 콘텐츠(<b>3D/XR 생성</b>)와 생명과학(<b>단백질·항체 구조 생성, 바이오 AI</b>)에 적용합니다. <b>설명가능 AI(XAI)</b>로 모델의 판단 근거를 제시하고, <b>미디어 포렌식 &amp; 허위정보 탐지</b>로 생성된 미디어의 진위를 판별합니다." data-en="We apply vision/graphics-based <b>3D generative models</b> to content (<b>3D/XR generation</b>) and to life science (<b>protein/antibody structure generation, bio AI</b>). <b>Explainable AI (XAI)</b> provides the evidence behind model decisions, and <b>media forensics &amp; disinformation detection</b> assesses the authenticity of generated media."></p>

  <h3 data-ko="설명가능한 생성과 탐지" data-en="Explainable Generation & Detection"></h3>
  <p data-ko="같은 <em>설명가능성(XAI)</em>으로, 창작자는 결과를 재생성이 아니라 <em>편집으로 제어</em>하고(3D/XR 생성), 이용자는 <em>왜 가짜인지를 납득</em>합니다(미디어 포렌식·허위정보 탐지). 생성과 탐지를 하나의 기술로 잇습니다." data-en="With one and the same <em>explainability (XAI)</em>, creators <em>steer by editing</em> (generation) and users <em>understand why something is fake</em> (detection). We join generation and detection through a single technology."></p></div>
