 <div class="sec-head"><span class="sec-num">03</span><h2 data-ko="연구<span class='h2sub'>인간–AI 공동창작 XR · 신뢰할 수 있는 생성 미디어</span>" data-en="Research<span class='h2sub'>Human–AI Co-Creative XR · Trustworthy Generative Media</span>"></h2></div>
 <p class="lead" style="margin-bottom:28px;" data-ko="우리는 생성 AI를 <b>만드는 사람의 도구</b>로 설계합니다. 창작자가 결과물이 놓일 <b>공간 안에서 직접 그리고, 편집하고, 다시 생성하는</b> XR 저작 환경을 만들고(<b>인간–AI 공동창작 XR</b>), 그렇게 생성된 미디어를 사람이 <b>납득할 수 있는 근거와 함께 판별</b>하게 합니다(<b>신뢰할 수 있는 생성 미디어</b>). 설명가능 AI는 두 축을 잇는 방법론이며, 3D 생성 파이프라인은 바이오 영역으로 확장됩니다." data-en="We design generative AI as <b>a tool for people who make things</b>. We build XR authoring environments where creators <b>sketch, edit, and regenerate inside the very space</b> where the result will live (<b>Human–AI Co-Creative XR</b>), and we let people <b>judge generated media with evidence they can understand</b> (<b>Trustworthy Generative Media</b>). Explainable AI is the method that joins the two, and our 3D generation pipeline extends into bio applications."></p>

  <article class="rcard g3d">

   <h3><span class="adot"></span><span data-ko="인간–AI 공동창작 XR" data-en="Human–AI Co-Creative XR"></span></h3>
   <p class="rq" data-ko="창작자가 생성 AI와 함께, 결과물이 놓일 공간 안에서 직접 저작하려면 무엇이 필요한가?" data-en="What does it take for creators to author with generative AI inside the space where the result will live?"></p>
   <ul class="rbul">
    <li data-ko="<b>스케치로 제어하는 공간 생성</b>: VR 안에서 정육면체 여섯 면에 그린 러프 스케치를 360° 스카이박스로 바꿉니다(CubeCanvas, SIGGRAPH Asia 2026)." data-en="<b>Sketch-steered spatial generation</b>: rough sketches drawn on six faces of a cube in VR become 360° skyboxes (CubeCanvas, SIGGRAPH Asia 2026)."></li>
    <li data-ko="<b>맥락을 이해하는 실시간 XR</b>: 깊이 인식 객체 지각(모바일 AR)과 생성형 3D 모델의 실시간 XR 객체 변환을 저작 공정으로 연결합니다." data-en="<b>Context-aware real-time XR</b>: depth-aware object perception (mobile AR) and real-time XR conversion of generative 3D models feed the authoring loop."></li>
    <li data-ko="<b>가상공간 속 사람의 경험</b>: 아바타의 비언어 소통 등 메타버스 사용자 경험을 분석해 설계 원칙으로 되돌립니다(PRESENCE, MIT Press)." data-en="<b>Human experience in virtual space</b>: we study metaverse UX such as avatars' nonverbal communication and feed it back into design (PRESENCE, MIT Press)."></li>
    <li data-ko="<b>창작 현장으로의 확장</b>: 인상파 회화 VR 체험, 웹툰·게임·동화 창작 등 예술 영역에서 공동창작 도구를 검증합니다." data-en="<b>Into creative practice</b>: Impressionist-painting VR, webtoons, games, and storytelling serve as testbeds for co-creation tools."></li>

   <div class="rtop"><span class="rnum">02</span><span class="rkey">Trust · Media Forensics</span></div>
   <h3><span class="adot"></span><span data-ko="신뢰할 수 있는 생성 미디어" data-en="Trustworthy Generative Media"></span></h3>
   <p class="rq" data-ko="생성·조작된 미디어를, 사람이 납득할 수 있는 근거와 함께 어떻게 판별하는가?" data-en="How do we tell generated or manipulated media apart, with evidence people can understand?"></p>
   <ul class="rbul">

 <div class="sig"><span class="sec-num" data-ko="고유의 관점" data-en="Our Signature"></span>
  <h3 data-ko="공간을 그리는 사람을 위한 생성 AI" data-en="Generative AI for People Who Picture Space"></h3>
  <p data-ko="사진으로 도시 공간을 읽던 2002년부터 3D 다중노출, VR 인문콘텐츠를 거쳐 VR 스케치로 공간을 생성하는 지금까지, 이 연구실의 질문은 늘 <em>사람이 공간을 어떻게 구상하고 표현하는가</em>였습니다. 이 이력은 생성 AI를 <em>결과를 뽑아내는 기계</em>가 아니라 <em>사람이 구상하고 고쳐 나가는 도구</em>로 보게 합니다. 그래서 우리는 창작자가 <em>결과가 놓일 공간 안에서 직접 그리고 편집하게</em> 하고(CubeCanvas), 이용자가 <em>생성된 미디어를 근거와 함께 판별하게</em> 합니다. 만드는 능력과 검증하는 능력을 하나의 인간 중심 관점으로 잇는 것이 이 연구실의 고유한 자리입니다." data-en="From reading urban space through photography in 2002, through 3D multi-exposure and VR humanities content, to generating space from VR sketches today, our question has always been <em>how people conceive and express space</em>. This path leads us to treat generative AI not as <em>a machine that outputs results</em> but as <em>a tool people conceive and revise with</em>. So we let creators <em>draw and edit inside the space where the result will live</em> (CubeCanvas), and let audiences <em>judge generated media with evidence</em>. Joining the ability to make with the ability to verify, under one human-centered view, is this lab's distinct place."></p></div>
