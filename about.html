 <div class="sec-head"><span class="sec-num">01</span><h2 data-ko="소개" data-en="About"></h2></div>
 <div class="about-grid"><div>
  <p data-ko="HCAI Lab은 <strong>인간 중심의 인공지능 기술</strong> 연구실입니다.<br><strong>컴퓨터 비전과 그래픽스</strong>를 토대로 인식·복원·생성·렌더링 등의 기술 연구가 핵심입니다. 시스템을 구현하고 사람을 위한 기술로 완성합니다.<br>인공지능 기술의 생성과 탐지 그리고 데이터 분석은 그 결과에 책임을 지며 설명할 수 있어야 합니다." data-en="HCAI Lab is a <strong>human-centered AI</strong> research lab.<br>Our core work is technical research in recognition, reconstruction, generation, and rendering, grounded in <strong>computer vision and graphics</strong>. We implement systems and develop them into technology for people.<br>AI for generation, detection, and data analysis must be accountable for its results and able to explain them."></p>
